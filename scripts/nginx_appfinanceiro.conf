# ==============================================================================
# Configuração Nginx para AppFinanceiro no NanoPi NEO
# Caminho na placa: /etc/nginx/sites-available/appfinanceiro
# Ativar com: sudo ln -s /etc/nginx/sites-available/appfinanceiro /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    server_name _;

    client_max_body_size 16M;

    # 1. Frontend React Compilado (Servido diretamente pelo Nginx - Zero overhead de RAM)
    location / {
        root /home/lnb/AppFinanceiro/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Cache de assets estáticos minificados
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # 2. Arquivos Estáticos do Django e Admin
    location /static/ {
        alias /home/lnb/AppFinanceiro/staticfiles/;
        expires 30d;
    }

    # 3. API Django REST Framework
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # 4. Portal Administrativo
    location /portal-admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Django Admin Padrão
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
